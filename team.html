<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nosso grupo | LinearCheck</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./CSS/team.css">
</head>

<body>
  <main class="team-page">
    <header class="team-header">
      <h1>Conheça nosso grupo!</h1>

      <a
        href="calculation.html"
        class="back-button"
        aria-label="Voltar para a página de cálculo"
      >
        <span class="back-arrow"></span>
      </a>
    </header>

    <section class="team-container" aria-label="Integrantes do grupo">
      <article class="member">
        <img
          src="../Images/AnaLarissa.png"
          alt="Ana Larissa"
          class="member__image"
        >

        <p class="member__name">Ana Larissa</p>
      </article>

      <article class="member">
        <img
          src="../Images/Andree.png"
          alt="Andrée Gastellie"
          class="member__image"
        >

        <p class="member__name">Andrée Gastellie</p>
      </article>

      <article class="member">
        <img
          src="../Images/Ingrid.png"
          alt="Ingrid Stefanny"
          class="member__image"
        >

        <p class="member__name">Ingrid Stefanny</p>
      </article>

      <article class="member">
        <img
          src="../Images/Erick.png"
          alt="José Erick"
          class="member__image"
        >

        <p class="member__name">José Erick</p>
      </article>

      <article class="member">
        <img
          src="../Images/Josenildo.png"
          alt="Josenildo Filho"
          class="member__image"
        >

        <p class="member__name">Josenildo Filho</p>
      </article>

      <article class="member">
        <img
          src="../Images/Lucas.png"
          alt="Lucas Ferreira"
          class="member__image"
        >

        <p class="member__name">Lucas Ferreira</p>
      </article>

      <article class="member">
        <img
          src="../Images/Paulo.png"
          alt="Paulo Henrique"
          class="member__image"
        >

        <p class="member__name">Paulo Henrique</p>
      </article>
    </section>
  </main>
</body>
</html>
